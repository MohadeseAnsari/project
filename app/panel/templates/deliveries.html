{% extends "base.html" %}
{% block title %}ارسال‌ها{% endblock %}
{% block content %}
<h2>ارسال‌ها</h2>
<form class="filters" hx-get="/deliveries/table" hx-target="#deliveries-table" hx-swap="innerHTML" hx-trigger="change, submit">
  <select name="status">
    <option value="">همه وضعیت‌ها</option>
    {% for s in ["pending","sending","sent","failed","awaiting_confirmation"] %}
    <option value="{{ s }}" {% if status==s %}selected{% endif %}>{{ s }}</option>
    {% endfor %}
  </select>
  <select name="platform">
    <option value="">همه سکوها</option>
    <option value="bale" {% if platform=='bale' %}selected{% endif %}>bale</option>
    <option value="telegram" {% if platform=='telegram' %}selected{% endif %}>telegram</option>
  </select>
  <input name="main_id" placeholder="شناسه رکورد" value="{{ main_id or '' }}" />
  <button class="btn btn-small" type="submit">اعمال</button>
</form>
<div id="deliveries-table" hx-get="/deliveries/table?{{ query }}" hx-trigger="load">در حال بارگذاری…</div>
{% endblock %}
