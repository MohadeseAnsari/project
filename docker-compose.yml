services:
  postgres:
    image: postgres:16
    # Bound to loopback only. Publishing 5432 on all interfaces put the database
    # on the public internet; combined with a default `postgres` password it was
    # wiped by an automated scanner. Other services reach it over the compose
    # network, so nothing needs the published port -- use an SSH tunnel for
    # admin access (`ssh -L 5432:localhost:5432 <host>`).
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      # No default on purpose. A `:-postgres` fallback fails open to a guessable
      # password when the variable is simply unset, which is exactly what
      # happened. Compose now refuses to start instead.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-irandoc_news}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot schema migration. Runs scripts/apply_migrations.py, which is
  # idempotent (applied files are tracked in the _migrations table), so it is
  # safe on every `up` and becomes a no-op once the schema exists. It creates
  # schema only -- no job/field rows are inserted here.
  migrate:
    build: .
    command: python scripts/apply_migrations.py
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-irandoc_news}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-irandoc_news}
      SHARED_SECRET: ${SHARED_SECRET}
      AVALAI_API_KEY: ${AVALAI_API_KEY}
      AVALAI_BASE_URL: ${AVALAI_BASE_URL:-https://api.avalai.ir/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.6-luna}
      # Browser origins allowed to call the API (the demo UI is served from :8080).
      # Add the host you will present from, e.g. "http://example.com:8080".
      DEMO_CORS_ORIGINS: ${DEMO_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      REQUIRE_HUMAN_CONFIRMATION: ${REQUIRE_HUMAN_CONFIRMATION:-true}
    volumes:
      - credentials_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Static demo UI for the API. Separate from the API so the presentation page
  # can be reloaded or replaced without restarting the service it talks to.
  demo:
    build: .
    # serve.py rather than `python -m http.server`: the slim image has no
    # /etc/mime.types, so http.server serves the webfonts as
    # application/octet-stream and browsers reject the font outright.
    command: python /srv/demo/serve.py
    volumes:
      - ./demo:/srv/demo:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

  worker:
    build: .
    command: python -m app.worker.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-irandoc_news}
      AVALAI_API_KEY: ${AVALAI_API_KEY}
      AVALAI_BASE_URL: ${AVALAI_BASE_URL:-https://api.avalai.ir/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.6-luna}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-1}
      WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-30}
      WORKER_LEASE_MINUTES: ${WORKER_LEASE_MINUTES:-5}
    volumes:
      - credentials_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Publisher: sends articles that reached status='review' to their routed
  # channels, throttled by SENDER_SEND_DELAY_SECONDS. Separate from `worker` so
  # channel rate limits and platform outages never affect article generation.
  # Bot tokens are required here (unlike the api/worker services) — without one
  # there is nothing to send with.
  sender:
    build: .
    command: python -m app.messaging.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-irandoc_news}
      BALE_BOT_TOKEN: ${BALE_BOT_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      SENDER_SEND_DELAY_SECONDS: ${SENDER_SEND_DELAY_SECONDS:-5}
      SENDER_POLL_INTERVAL_SECONDS: ${SENDER_POLL_INTERVAL_SECONDS:-2}
      SENDER_MAX_ATTEMPTS: ${SENDER_MAX_ATTEMPTS:-5}
      SENDER_BACKOFF_BASE_SECONDS: ${SENDER_BACKOFF_BASE_SECONDS:-10}
      SENDER_REQUEST_TIMEOUT_SECONDS: ${SENDER_REQUEST_TIMEOUT_SECONDS:-20}
      SENDER_LEASE_MINUTES: ${SENDER_LEASE_MINUTES:-5}
      REQUIRE_HUMAN_CONFIRMATION: ${REQUIRE_HUMAN_CONFIRMATION:-true}
    volumes:
      - credentials_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_started
    restart: unless-stopped

  # Server-rendered review panel (Jinja2 + locally vendored HTMX, no build
  # step). Same image as `api` with a different command. Deployed
  # loopback-only: the ONLY public door is the HTTPS reverse proxy forwarding
  # to it. PANEL_PORT is the single knob: `127.0.0.1:8081` (default, private);
  # `8081` binds all interfaces (public emergency use, only behind TLS).
  web:
    build: .
    command: uvicorn app.panel.app:panel_app --host 0.0.0.0 --port 8081
    ports:
      - "${PANEL_PORT:-8081}:8081"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-irandoc_news}
      PANEL_ADMIN_USERNAME: ${PANEL_ADMIN_USERNAME:-admin}
      PANEL_ADMIN_PASSWORD: ${PANEL_ADMIN_PASSWORD:-}
      PANEL_SECRET_KEY: ${PANEL_SECRET_KEY:-change-me-in-production}
      PANEL_COOKIE_SECURE: ${PANEL_COOKIE_SECURE:-false}
      PANEL_SESSION_HOURS: ${PANEL_SESSION_HOURS:-12}
      PANEL_TRUSTED_PROXIES: ${PANEL_TRUSTED_PROXIES:-}
      PANEL_LOGIN_MAX_ATTEMPTS: ${PANEL_LOGIN_MAX_ATTEMPTS:-10}
      PANEL_LOGIN_WINDOW_MINUTES: ${PANEL_LOGIN_WINDOW_MINUTES:-10}
      PANEL_LOGIN_LOCKOUT_MINUTES: ${PANEL_LOGIN_LOCKOUT_MINUTES:-15}
      AVALAI_API_KEY: ${AVALAI_API_KEY:-}
      AVALAI_BASE_URL: ${AVALAI_BASE_URL:-https://api.avalai.ir/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.6-luna}
    volumes:
      - credentials_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pg_data:
  # Master key for database-stored credentials (PART D). Every service that
  # reads or writes an encrypted key must see the SAME file, otherwise the
  # panel could not decrypt what the API encrypted (each container would
  # otherwise generate its own key). It is created on first boot inside this
  # volume with mode 0600.
  #
  # To manage it explicitly instead, generate one and put it in .env for
  # every service:
  #   python3 -c "from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())"
  # then remove the generated file: docker compose exec api rm -f /app/data/.credentials_key
  # and bring the stack up again. Never commit the key (.gitignore covers it);
  # without it every stored credential becomes undecryptable.
  credentials_data:
