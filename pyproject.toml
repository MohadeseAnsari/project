[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["app/panel/static", "backups"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# conftest must set DATABASE_URL before importing application modules.
"tests/conftest.py" = ["E402"]
